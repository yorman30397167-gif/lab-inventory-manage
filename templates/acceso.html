<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-Inventory Manager - Control de Acceso</title>
    <style>
        @keyframes seguridadBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            display: flex; 
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #451a03, #0f172a);
            background-size: 400% 400%;
            animation: seguridadBg 14s ease infinite;
            color: #333; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .sidebar { width: 260px; background-color: #1e293b; color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar h2 { font-size: 20px; text-align: center; margin-bottom: 30px; color: #38bdf8; font-weight: bold; }
        .menu-item { padding: 12px 15px; color: #cbd5e1; text-decoration: none; display: block; border-radius: 6px; margin-bottom: 8px; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background-color: #334155; color: white; font-weight: bold; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }
        .header h1 { font-size: 26px; color: #f8fafc; }

        .table-container { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px); border-radius: 10px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); padding: 20px; border: 1px solid rgba(255, 255, 255, 0.5); }
        .table-container h2 { font-size: 18px; margin-bottom: 15px; color: #0f172a; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(241, 245, 249, 0.8); padding: 12px; color: #475569; font-size: 14px; border-bottom: 2px solid #cbd5e1; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #1e293b; }
        tr:hover { background-color: rgba(241, 245, 249, 0.5); }

        .btn-toggle { border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-toggle.deactivate { background-color: #fee2e2; color: #991b1b; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-toggle.activate { background-color: #d1fae5; color: #065f46; border: 1px solid rgba(16, 185, 129, 0.2); }
        .btn-edit { background-color: #e0f2fe; color: #0369a1; border: 1px solid rgba(14, 165, 233, 0.2); margin-right: 4px; }
        .btn-delete { background-color: #ffedd5; color: #c2410c; border: 1px solid rgba(249, 115, 22, 0.2); }

        .alert-flash { padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .alert-flash.success { background-color: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .modal-content { background-color: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; cursor: pointer; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn-submit { width: 100%; background-color: #0ea5e9; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Lab-Inventory</h2>
            <a href="{{ url_for('home') }}" class="menu-item">📊 Panel Principal</a>
            <a href="{{ url_for('inventario') }}" class="menu-item">🖥️ Equipos e Inventario</a>
            <a href="{{ url_for('mantenimiento') }}" class="menu-item">🔧 Mantenimiento Preventivo</a>
            <a href="{{ url_for('acceso') }}" class="menu-item active">🔑 Control de Acceso</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header"><h1>Gestión de Usuarios</h1></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Cédula</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for usuario in usuarios %}
                    <tr>
                        <td>{{ usuario.nombre }} {{ usuario.apellido }}</td>
                        <td>{{ usuario.cedula }}</td>
                        <td>{{ usuario.estado }}</td>
                        <td>
                            <form action="{{ url_for('cambiar_estado_usuario', usuario_id=usuario.id) }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn-toggle {% if usuario.estado == 'Activo' %}deactivate{% else %}activate{% endif %}">
                                    {% if usuario.estado == 'Activo' %}🔒 Desactivar{% else %}🔓 Activar{% endif %}
                                </button>
                            </form>
                            <button class="btn-toggle btn-edit" onclick="abrirModalEdicion('{{ usuario.id }}', '{{ usuario.username }}')">✏️ Soporte</button>
                        </td>
                    </tr>

                    <div id="modal-{{ usuario.id }}" class="modal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3>⚙️ Soporte</h3>
                                <button class="modal-close" onclick="cerrarModalEdicion('{{ usuario.id }}')">&times;</button>
                            </div>
                            <form action="{{ url_for('cambiar_estado_usuario', usuario_id=usuario.id) }}" method="POST">
                                <div class="form-group">
                                    <label>Nuevo Usuario</label>
                                    <input type="text" id="input-user-{{ usuario.id }}" name="username" required>
                                </div>
                                <div class="form-group">
                                    <label>Nueva Contraseña</label>
                                    <input type="text" name="password" required>
                                </div>
                                <button type="submit" class="btn-submit">💾 Guardar</button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function abrirModalEdicion(id, username) { document.getElementById('modal-' + id).style.display = 'flex'; }
        function cerrarModalEdicion(id) { document.getElementById('modal-' + id).style.display = 'none'; }
    </script>
</body>
</html>
